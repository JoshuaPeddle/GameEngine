name: .NET build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# A newer push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # Without libfontconfig1 libSkiaSharp fails to load and the test host crashes
    # rather than reporting failures.
    - name: Install native dependencies for SkiaSharp
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Install workloads
      run: dotnet workload restore

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal

  android-smoke:
    name: Android startup smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Restore Android workload
      run: dotnet workload restore GameEngine.Runner.Avalonia/GameEngine.Runner.Avalonia.Android/GameEngine.Runner.Avalonia.Android.csproj

    - name: Publish Android APK
      run: dotnet publish GameEngine.Runner.Avalonia/GameEngine.Runner.Avalonia.Android/GameEngine.Runner.Avalonia.Android.csproj --configuration Release

    - name: Stage APK
      run: |
        mkdir -p artifacts/android-apk
        find GameEngine.Runner.Avalonia/GameEngine.Runner.Avalonia.Android/bin/Release -type f -name '*-Signed.apk' -exec cp {} artifacts/android-apk/ \;
        ls -la artifacts/android-apk

    # The emulator needs room for its system image and userdata partition, and a runner
    # that has just built .NET and Android has very little left. Reported either way, so a
    # failure to boot can be told apart from a failure to run.
    - name: Reclaim disk for the emulator
      run: |
        echo "::group::Before"
        df -h /
        echo "::endgroup::"
        sudo rm -rf \
          /usr/local/lib/android/sdk/ndk \
          /usr/local/lib/android/sdk/cmake \
          /opt/ghc /usr/local/.ghcup \
          /usr/share/swift \
          /opt/hostedtoolcache/CodeQL \
          /usr/local/share/powershell \
          /usr/local/share/boost || true
        docker image prune -af || true
        find . -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} + || true
        dotnet nuget locals all --clear || true
        echo "::group::After"
        df -h /
        echo "::endgroup::"

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -l /dev/kvm

    # aosp_atd is the lightest image that can run the app — it needs no Google APIs — and the
    # emulator is given the resources the runner actually has rather than a starved subset,
    # which is what stopped it booting on the August 2026 runner images.
    - name: Launch app and wait for first rendered frame
      uses: ReactiveCircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
      with:
        api-level: 35
        target: aosp_atd
        arch: x86_64
        profile: pixel_6
        cores: 4
        ram-size: 4096M
        disk-size: 8192M
        emulator-boot-timeout: 900
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot -no-metrics
        script: bash .github/scripts/android-smoke-test.sh

    - name: Upload Android smoke diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: android-smoke-diagnostics
        path: artifacts/android-smoke
        if-no-files-found: warn

  template:
    name: Template produces a working game
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install native dependencies for SkiaSharp
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1

    # The template references the engine by package, so the local build has to be packed
    # into a feed before a generated game can restore against it.
    - name: Pack the engine and the template
      run: |
        for project in \
          GameEngine.Core/GameEngine.Core.csproj \
          GameEngine.Runner.Avalonia/GameEngine.Runner.Avalonia/GameEngine.Runner.Avalonia.csproj \
          templates/GameEngine.Templates.csproj
        do
          dotnet pack "$project" -c Release -o "$RUNNER_TEMP/feed"
        done

    - name: Create a game from the template
      run: |
        dotnet new install "$RUNNER_TEMP/feed"/GameEngine.Templates.*.nupkg
        mkdir -p "$RUNNER_TEMP/scratch"
        cd "$RUNNER_TEMP/scratch"
        dotnet new gameengine-game -n SmokeGame --no-restore
        cat > SmokeGame/nuget.config <<EOF
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <add key="local" value="$RUNNER_TEMP/feed" />
          </packageSources>
        </configuration>
        EOF

    - name: Build and test the generated game
      run: |
        cd "$RUNNER_TEMP/scratch/SmokeGame"
        dotnet build src/SmokeGame.Desktop -c Release
        dotnet test tests/SmokeGame.Tests -c Release
