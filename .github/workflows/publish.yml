name: Publish

# Releases are cut from tags, not from every push to master.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to build (no leading v). Leave blank to use 0.0.<run number>.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      is_tag: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - id: pick
        run: |
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            VERSION="${{ github.event.inputs.release_version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish runner
        run: dotnet publish GameEngine.Runner.Avalonia/GameEngine.Runner.Avalonia.Desktop/GameEngine.Runner.Avalonia.Desktop.csproj -c Release -r ${{ matrix.rid }} -p:Version=${{ needs.version.outputs.version }} -o artifacts/runner-${{ matrix.rid }}

      - name: Publish editor
        if: matrix.rid != 'osx-arm64'
        run: dotnet publish GameEngine.Editor.Desktop/GameEngine.Editor.Desktop.csproj -c Release -r ${{ matrix.rid }} -p:Version=${{ needs.version.outputs.version }} -o artifacts/editor-${{ matrix.rid }}

      - name: Package
        shell: bash
        run: |
          cd artifacts
          for dir in */; do
            tar -czf "../${dir%/}.tar.gz" "${dir%/}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: '*.tar.gz'

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3

      - name: Install Android workload
        run: dotnet workload restore GameEngine.Runner.Avalonia/GameEngine.Runner.Avalonia.Android/GameEngine.Runner.Avalonia.Android.csproj

      - name: Publish APK
        run: dotnet publish GameEngine.Runner.Avalonia/GameEngine.Runner.Avalonia.Android/GameEngine.Runner.Avalonia.Android.csproj -c Release -f net10.0-android -p:Version=${{ needs.version.outputs.version }}

      - name: Stage APK
        run: |
          mkdir -p out
          find GameEngine.Runner.Avalonia/GameEngine.Runner.Avalonia.Android/bin/Release -name '*-Signed.apk' -exec cp {} out/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  browser:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install wasm workload
        run: dotnet workload install wasm-tools

      # A plain static bundle: unzip it onto GitHub Pages, itch.io or any web host.
      - name: Publish browser bundle
        run: dotnet publish GameEngine.Runner.Avalonia/GameEngine.Runner.Avalonia.Browser/GameEngine.Runner.Avalonia.Browser.csproj -c Release -p:Version=${{ needs.version.outputs.version }} -o artifacts/browser

      - name: Package
        run: |
          cd artifacts/browser/wwwroot
          zip -r ../../../browser-wwwroot.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: browser
          path: browser-wwwroot.zip

  docker:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Avalonia.Browser.Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            joshuapeddle/gameengine-web:latest
            joshuapeddle/gameengine-web:${{ needs.version.outputs.version }}

  release:
    needs: [version, desktop, android, browser]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.version.outputs.version }}
          files: artifacts/**/*
          generate_release_notes: true
