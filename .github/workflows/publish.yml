name: .NET publish

on: 
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (optional). Leave blank for auto-generated version.'
        required: false
        default: ''  
  pull_request: # TODO: Remove
    branches: [ "master" ]

jobs:
  publish:
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
        
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install workloads
      run:  dotnet workload restore 

    - name: Restore dependencies
      run: dotnet restore GameEngine.Runner.Avalonia/GameEngine.Runner.Avalonia.Desktop/GameEngine.Runner.Avalonia.Desktop.csproj

    - name: Build
      run: dotnet build GameEngine.Runner.Avalonia/GameEngine.Runner.Avalonia.Desktop/GameEngine.Runner.Avalonia.Desktop.csproj -c Release --no-restore

    - name: Publish Linux
      run: dotnet publish GameEngine.Runner.Avalonia/GameEngine.Runner.Avalonia.Desktop/GameEngine.Runner.Avalonia.Desktop.csproj -r linux-x64 -c Release

    - name: Publish Windows
      run: dotnet publish GameEngine.Runner.Avalonia/GameEngine.Runner.Avalonia.Desktop/GameEngine.Runner.Avalonia.Desktop.csproj -r win-x64 -c Release

    - name: Build Android
      run: dotnet build GameEngine.Runner.Avalonia/GameEngine.Runner.Avalonia.Android/GameEngine.Runner.Avalonia.Android.csproj -c Release -f net8.0-android

    - name: Zip Linux Release
      run: zip -r linux_artifact.zip GameEngine.Runner.Avalonia/GameEngine.Runner.Avalonia.Desktop/bin/Release/net8.0/linux-x64/publish

    - name: Zip Windows Release
      run: zip -r windows_artifact.zip GameEngine.Runner.Avalonia/GameEngine.Runner.Avalonia.Desktop/bin/Release/net8.0/win-x64/publish

    - name: Zip Android Release
      run: zip android_artifact.zip GameEngine.Runner.Avalonia/GameEngine.Runner.Avalonia.Android/bin/Release/net8.0-android/*-Signed.apk

    - name: Determine Release Version
      id: version
      run: |
        if [ -z "${{ github.event.inputs.release_version }}" ]; then
          VERSION="1.0.${{ github.run_number }}"
        else
          VERSION="${{ github.event.inputs.release_version }}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Release version: $VERSION"
      
    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.VERSION }}
        release_name: "Release ${{ env.VERSION }}"
        body: 'Release of the build.'
        draft: false
        prerelease: false

    - name: Upload Linux Artifact
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./linux_artifact.zip
        asset_name: linux_artifact.zip
        asset_content_type: application/zip

    - name: Upload Windows Artifact
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./windows_artifact.zip
        asset_name: windows_artifact.zip
        asset_content_type: application/zip

    - name: Upload Android Artifact
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./android_artifact.zip
        asset_name: android_artifact.zip
        asset_content_type: application/zip

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }} 

    - name: Build and push multi-platform image
      uses: docker/build-push-action@v3
      with:
        context: .
        file: Avalonia.Browser.Dockerfile
        platforms: linux/arm64,linux/amd64
        push: true
        tags: |
          joshuapeddle/gameengine-web:latest
          joshuapeddle/gameengine-web:${{ env.VERSION }}